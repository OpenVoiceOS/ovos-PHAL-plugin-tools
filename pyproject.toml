[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-tools"
dynamic = ["version"]
description = "PHAL service provider exposing OVOS tool plugins over the messagebus"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "JarbasAi", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.10"
dependencies = [
    "ovos-plugin-manager>=2.11.1a1",
    "ovos-utils>=0.1.0",
    "ovos-bus-client>=0.0.8",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-tools"
Repository = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-tools"

[project.optional-dependencies]
# ovoscope>=1.5.0 requires pytest>=8 (it fixed the pre-8.0
# pytest_pycollect_makemodule hook signature dependency).
test = ["pytest>=8", "pytest-cov", "ovoscope>=1.5.0"]

[project.entry-points."opm.phal"]
ovos-phal-plugin-tools = "ovos_phal_plugin_tools:OVOSToolsPHALPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_phal_plugin_tools.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_phal_plugin_tools*"]
